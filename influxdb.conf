# InfluxDB configuration for Graphite protocol (Gatling metrics)

[meta]
  dir = "/var/lib/influxdb/meta"
  retention-autocreate = true
  logging-enabled = true

[data]
  dir = "/var/lib/influxdb/data"
  wal-dir = "/var/lib/influxdb/wal"
  wal-fsync-delay = "0s"
  query-log-enabled = false
  validate-keys = false
  cache-max-memory-bytes = 1073741824
  cache-snapshot-memory-bytes = 26214400
  cache-snapshot-write-cold-duration = "1h"
  compact-min-generation = 25
  max-points-select = 0
  max-series-per-database = 1000000
  trace-logging-enabled = false
  tsm-use-mmap = true
  index-version = "inmem"

[retention]
  enabled = true
  check-interval = "30m"

[shard-precreation]
  enabled = true
  check-interval = "10m"
  advance-period = "30m"

[monitor]
  store-enabled = false
  store-database = "_internal"
  store-interval = "10s"

[subscriber]
  enabled = true
  http-timeout = "30s"
  insecure-skip-verify = false
  ca-certs = ""
  write-concurrency = 40
  write-buffer-size = 1000

[http]
  enabled = true
  bind-address = ":8086"
  auth-enabled = false
  log-enabled = true
  write-tracing = false
  pprof-enabled = true
  https-enabled = false
  max-row-limit = 0
  max-connection-limit = 0
  shared-secret = ""
  realm = "InfluxDB"
  bind-socket = "/var/run/influxdb.sock"
  unix-socket-enabled = false
  bind-unix-socket = "/var/run/influxdb.sock"

[ifql]
  enabled = true

# 🔴 ВАЖНО: Конфигурация Graphite protocol для Gatling
[[graphite]]
  enabled = true
  bind-address = ":2003"
  database = "gatling"
  retention-policy = ""
  protocol = "tcp"
  batch-size = 5000
  batch-pending = 10
  batch-timeout = "1s"
  consistency-level = "one"
  separator = "."
  udp-read-buffer = 0
  # ВОТ ПРАВИЛЬНЫЙ ШАБЛОН ДЛЯ 9935:
  templates = [
      "gatling.*.users.*.*                  measurement.simulation.measurement.request",
      "gatling.*.*.*.*.*.*.count            measurement.simulation.request.status.field",
      "gatling.*.*.*.*.*.*.min              measurement.simulation.request.status.field",
      "gatling.*.*.*.*.*.*.max              measurement.simulation.request.status.field",
      "gatling.*.*.*.*.*.*.mean             measurement.simulation.request.status.field",
      "gatling.*.*.*.*.*.*.stdDev           measurement.simulation.request.status.field",
      "gatling.*.*.*.*.*.*.percentiles50    measurement.simulation.request.status.field",
      "gatling.*.*.*.*.*.*.percentiles75    measurement.simulation.request.status.field",
      "gatling.*.*.*.*.*.*.percentiles95    measurement.simulation.request.status.field",
      "gatling.*.*.*.*.*.*.percentiles99    measurement.simulation.request.status.field",
      "gatling.*.*.*.*.*.*                  measurement.simulation.request.status.field"
    ]



[[collectd]]
  enabled = false

[[opentsdb]]
  enabled = false

[[udp]]
  enabled = false

[logging]
  format = "auto"
  level = "info"
  suppress-logo = false
